name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: ./target/release/frp-visualizer check examples/calibration.frp --strict
      - run: ./target/release/frp-visualizer check examples/component.frp --strict
      - run: ./target/release/frp-visualizer render examples/component.frp /tmp/frp-visualizer-check --timing-scope all --timing-values none --focus-transaction 1 --expand-all
      - run: test -f /tmp/frp-visualizer-check/timing_accumulate.svg
      - run: test -f /tmp/frp-visualizer-check/expanded_accumulate.svg
      - run: jq -e '.timing_reliable == true and .values_reliable == true' /tmp/frp-visualizer-check/trace.json
      - run: ./target/release/frp-visualizer check examples/nested.frp --strict
      - run: ./target/release/frp-visualizer render examples/nested.frp /tmp/frp-visualizer-nested --timing-scope all
      - run: test -f /tmp/frp-visualizer-nested/timing_outer_inner.svg
