name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: ./target/release/frp-visualizer check examples/calibration.frp --strict
      - run: ./target/release/frp-visualizer check examples/component.frp --strict
      - run: ./target/release/frp-visualizer render examples/component.frp /tmp/frp-visualizer-check --timing-scope all --timing-values none
      - run: test -f /tmp/frp-visualizer-check/timing_accumulate.svg
